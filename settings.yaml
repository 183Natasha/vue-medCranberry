# ============================================================
# Базовый конфиг приложения «МедиКабинет» (settings.yaml).
# Читается при запуске: значения становятся настройками по
# умолчанию. Переопределения, сделанные администратором в UI,
# хранятся локально (localStorage) и действуют до отката.
#
# Расширение: добавляйте новые секции — они попадут в AppSettings
# (src/services/app-config.ts) без изменения загрузчика.
# ============================================================

---
# Учетная запись суперпользователя (справочно; роли — в каталоге пользователей)
superuser: admin

theme:
  # Базовая тема при первом входе (переопределяется ui-settings пользователя)
  dark: false

logs:
  # Включено ли логирование событий (вход/выход и др.)
  enabled: true
  # Режим хранения журнала:
  #   localstorage — в браузере (ключ auth-audit), как раньше
  #   file         — на сервере через Node-бэкенд (батчами, путь ниже)
  mode: file
  # Путь к файлу логов (для режима file)
  path: logs/audit.log
  # Сколько событий копится перед отправкой на сервер (режим file)
  flushEvery: 5
