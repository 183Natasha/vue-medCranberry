# ============================================================================
# db.yaml — имитация БД «МедиКабинета» (YAML).
# В будущем заменится на SQLite/PG; пока — единый файл с атомарной записью.
#
# Структура:
#   meta                  — версия схемы, таймстэмп
#   constants             — справочники (test_types, scales)
#   users                 — пользователи (password_hash + salt, без plaintext)
#   system_notifications  — broadcast-уведомления (admin)
#   records               — данные пациентов (PatientRecord, как в store.ts)
#
# Правила:
#   - строки-ловушки YAML-булеанов цитировать: "on", "off", "yes", "no"
#   - даты: ISO 8601 ('YYYY-MM-DDTHH:MM:SS.sssZ') или 'YYYY-MM-DD'
#   - timestamps (ms) — как в store.ts (Visit.date)
# ============================================================================

meta:
  schema_version: 1
  created_at: '2026-10-25T00:00:00.000Z'
  updated_at: '2026-10-25T00:00:00.000Z'

# ---------- Справочники ----------
constants:
  # Типы тестов (как в store.ts TEST_TYPES)
  test_types:
    HADS_A: { name: 'HADS-A (тревога)', max: 21 }
    HADS_D: { name: 'HADS-D (депрессия)', max: 21 }
    PHQ4:   { name: 'PHQ-4 (скрининг)', max: 12 }
    PHQ9:   { name: 'PHQ-9 (депрессия)', max: 27 }
    GAD7:   { name: 'GAD-7 (тревога)', max: 21 }
    ISI:    { name: 'ISI (инсомния)', max: 28 }
  # Шкалы (ключ как в scales.ts SCALES; тексты вопросов НЕ дублируются)
  scales:
    HADS: { title: 'HADS — госпитальная шкала тревоги и депрессии', question_count: 14 }
    PHQ4: { title: 'PHQ-4 — экспресс-скрининг тревоги и депрессии', question_count: 4 }
    PHQ9: { title: 'PHQ-9 — шкала депрессии', question_count: 9 }
    GAD7: { title: 'GAD-7 — шкала генерализованного тревожного расстройства', question_count: 7 }
    ISI:  { title: 'ISI — индекс тяжести инсомнии', question_count: 7 }

